name: check-dist

# The Action runs the committed dist/index.js, so a PR whose dist/ lags src/ ships
# stale behavior. This fails any such PR or push.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # [LAW:one-source-of-truth] Build on the Node major the Action runs on: action.yml runs.using.
      - id: runtime
        run: |
          using=$(yq '.runs.using' action.yml)
          major=${using#node}
          [[ "$major" =~ ^[0-9]+$ ]] || { echo "ERROR: action.yml runs.using is '$using', not nodeNN" >&2; exit 1; }
          echo "node=$major" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:dist
