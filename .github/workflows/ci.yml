name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # The Action runs the committed dist/index.js, so a PR whose dist/ lags src/ ships
  # stale behavior. This fails any such PR or push.
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm run check:dist

  # The build only warns on type errors, so the typecheck and the suite run here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test
